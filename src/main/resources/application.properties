# MySQL \uC5F0\uACB0 \uC124\uC815
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# \u26A0\uFE0F \uC911\uC694: \uB9E8 \uB4A4\uC758 \uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uC774\uB984(ox_quiz \uB610\uB294 members)\uC774 \uC2E4\uC81C MySQL\uC5D0 \uC0DD\uC131\uB41C \uC774\uB984\uACFC \uC77C\uCE58\uD574\uC57C \uD569\uB2C8\uB2E4!
spring.datasource.url=jdbc:mysql://localhost:3306/ox_quiz?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
# \u26A0\uFE0F \uC911\uC694: \uD658\uACBD\uBCC0\uC218 \uB300\uC2E0 \uC2E4\uC81C \uC811\uC18D \uACC4\uC815 \uC815\uBCF4\uB97C \uC9C1\uC811 \uC785\uB825\uD558\uC138\uC694.
spring.datasource.username=root
spring.datasource.password=1111

# JPA \uBC0F \uD558\uC774\uBC84\uB124\uC774\uD2B8 \uC124\uC815 (\uD14C\uC2A4\uD2B8 \uB2E8\uACC4\uB97C \uC704\uD574 update\uB85C \uBCC0\uACBD \uCD94\uCC9C)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# \uB85C\uADF8 \uCD9C\uB825 \uBC0F \uBC29\uC5B8
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
